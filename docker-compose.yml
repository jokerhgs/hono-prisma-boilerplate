# docker-compose is useful for local Lambda emulation and integration testing.
# It is NOT used in the Lambda deployment itself.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hono-lambda-server
    ports:
      # AWS Lambda Runtime Interface Emulator (RIE) listens on 8080
      - "9000:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - .env
